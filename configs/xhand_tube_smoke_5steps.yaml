# Stage 3 target-embodiment fine-tuning.
training_mode: "finetune"

# 6、7、25、37


common:
  # Robot dimensions
  action_dim: 19      # 根据数据集的动作维度设置
  state_dim: 18       # 根据数据集的状态维度设置

  # Video settings (resize LeRobot dataset video frames to this resolution)
  num_video_frames: 8
  video_height: 384
  video_width: 320

  # Sampling strategy parameters
  global_downsample_rate: 1
  video_action_freq_ratio: 6

# Dataset configuration
dataset:
  type: "lerobot"
  max_episodes: null
  val_ratio: 0.1       # Episode-level split: 900 train / 100 validation
  image_aug: false

  # Task selection parameters
  task_mode: "single"      # "single" or "multi" - single task or multi task training
  task_name: "ABPP-XHand-Tube-Insert"    # 使用自己数据集的task_name
    # - "ABPP-XHand-Bunsen-Manipulate"
    # - "ABPP-XHand-MixerPanel-Manipulate"
    # - "ABPP-XHand-ThermalCycler-Close"
    # - "ABPP-XHand-ThermalCycler-Open"
    # - "ABPP-XHand-Tube-Insert"
  #   - Single task: task_name: fold_towel
  #   - Multiple specified tasks (multi mode): task_name: [fold_towel, fold_towel_0929]
  #   - All tasks (multi mode): task_name: null
  # task_name: null # null means all tasks in the dataset or ["task1", "task2"] for specific tasks

  params:
    # Required: LeRobotMotusDataset needs repo_id + root to locate the local dataset
    repo_id: "ABPP-XHand-Tube-Insert"
    root: "/mnt/shared-storage-user/wanzhaoqi/datasets/ABPP-XHand-Tube-Insert"

    # Embodiment type for loading normalization statistics (e.g., "aloha_agilex_2", "ac_one")
    embodiment_type: "xhand"

    # Task-level T5 caches are generated before training as t5_embedding/task_XXXXXX.pt.
    enable_t5_fallback: false
    t5_folder_name: "t5_embedding"

# Model configuration（directly use ac_one default WAN/VLM paths）
model:
  wan:
    config_path: "/mnt/shared-storage-user/wanzhaoqi/pretrained_models/Wan2.2-TI2V-5B"
    checkpoint_path: "/mnt/shared-storage-user/wanzhaoqi/pretrained_models/Wan2.2-TI2V-5B"
    vae_path: "/mnt/shared-storage-user/wanzhaoqi/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"
  vlm:
    checkpoint_path: "/mnt/shared-storage-user/wanzhaoqi/pretrained_models/Qwen3-VL-2B-Instruct"
    precision: "bfloat16"
    frozen: true
  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"
  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0
  inference:
    num_inference_timesteps: 10
  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0
  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

# Training configuration
training:
  # Optimization settings
  batch_size: 2
  max_steps: 5
  learning_rate: 5.0e-5
  weight_decay: 0.01

  # Scheduler settings
  scheduler_type: "linear"
  warmup_steps: 1000
  cycle_length: 225000
  f_max: 0.99           # Maximum learning rate multiplier after warmup
  f_min: 0.4            # Minimum learning rate multiplier at end

  # Gradient settings
  grad_clip_norm: 0.5

  # Mixed precision
  use_amp: true          # Use automatic mixed precision

  # Distributed training
  find_unused_parameters: false

# System settings
system:
  # Paths
  checkpoint_dir: "/mnt/shared-storage-user/wanzhaoqi/Motus/checkpoints"
  log_level: "INFO"

  # Intervals
  log_interval: 10
  save_interval: 5
  val_interval: 5

  # Hardware settings
  num_workers: 8
  pin_memory: true

# Profiler settings (for performance analysis, especially dataset loading)
profiler:
  enable: false
  interval: 100          # Profiler interval (not used directly, but kept for compatibility)
  warmup_steps: 5        # Number of warmup steps before profiling starts
  active_steps: 5        # Number of active profiling steps per cycle
  repeat_steps: 1000     # Number of steps to wait before repeating profiling cycle

# Logging settings
logging:
  # Reporting - support multiple logging backends
  report_to: "wandb"

  # Weights & Biases settings
  wandb_project: "motus"

  # TensorBoard settings
  tensorboard_log_dir: "tensorboard_logs"

  # Run naming
  run_name: "xhand_tube_smoke_5steps_4gpu_bs2"


# Resume training settings
resume:
  checkpoint_path: null  # Path to checkpoint to resume from

# Finetune settings
finetune:
  checkpoint_path: "/mnt/shared-storage-user/wanzhaoqi/pretrained_models/Motus"
